version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: quantumshield-db
    environment:
      POSTGRES_USER: quantumshield
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: quantumshield
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: quantumshield-redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: quantumshield-api
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_USER=quantumshield
      - DB_PASSWORD=password123
      - DB_NAME=quantumshield
      - REDIS_ADDR=redis:6379
    depends_on:
      - postgres
      - redis

  scan-engine:
    build:
      context: ./apps/scan
      dockerfile: Dockerfile
    container_name: quantumshield-scan-engine
    ports:
      - "8000:8000"
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis

  proxy:
    build:
      context: .
      dockerfile: docker/proxy.Dockerfile
    container_name: quantumshield-proxy
    ports:
      - "8443:8443"
    environment:
      - API_GATEWAY_URL=http://api:8080
      - PROXY_UPSTREAM=http://host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api

volumes:
  postgres_data:
